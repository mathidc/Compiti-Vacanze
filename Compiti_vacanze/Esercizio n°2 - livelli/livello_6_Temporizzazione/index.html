<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h1>Livello 6</h1>
    <div class="container">
        <h3>Cronometro</h3>
        <div class="d-flex">
            <p id="secondi">0</p>.<p id="millisecondi">0</p>s
        </div>
        
        <button class="btn btn-success" id="btnavvia">Avvia</button>
        <button class="btn btn-warning" id="btnferma">Ferma</button>
        <button class="btn btn-danger" id="btnazzera">Azzera</button>

        <h3>Timer conto alla rovescia</h3>
        <input type="number" id="inputRovescia" class="form-control">
        <button class="btn btn-primary" id="btnContoRovescia">Avvia timer</button>
        <p id="risultato" class="text-danger fw-bold"></p>

        <h3>Gioco a tempo</h3>
        <p>Tempo: <p id="tempo">30</p></p> Speciali trovati: <p id="trovati">0</p>/5
        <p id="risultato2"></p>
        <div id="griglia"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
