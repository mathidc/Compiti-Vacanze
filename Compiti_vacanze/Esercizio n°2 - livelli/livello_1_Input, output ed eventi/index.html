<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Livello 1</h1>
    <div class="container">
        <h3>Messaggio personalizzato</h3>
        <input type="text" placeholder="Inserisci il tuo nome" class="form-control mb-3" id="nomeId">
        <button class="btn btn-primary" onclick="salutare()">Salutami</button>
        <p id="idNascosto"></p>

        <h3>Contatore di tentativi</h3>
        <button class="btn btn-outline-success" onclick="conta()">cliccami</button>
        <p  class="fw-bold">cont: <p id="aumento">0</p> </p>
        <h3>Cambio colore di una casella</h3>
        <div id="riquadro" class="mb-2"></div>
        <button class="btn btn-danger " onclick="cambiaColore('red')">Rosso</button>
        <button class="btn btn-primary" onclick="cambiaColore('blue')">Blu</button>
        <button class="btn btn-warning" onclick="cambiaColore('yellow')">Giallo</button>

        <h3>Mostra / nascondi contenuto</h3>
        <button class="btn btn-dark" onclick="nascondi()">Mostra / nascondi</button>
        <div id="DivNascosto">Questo è un div segreto</div>
    </div>    
    <script src="script.js"></script>
</body>
</html>
