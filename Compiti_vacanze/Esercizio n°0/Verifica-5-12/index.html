<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top bg-purple text-white" id="header">
        <div class="container">
            <h4 class="navbar-brand fw-bold text-white">MyHobbies</h4>
            <div class="justify-content-end">
                <ul class="navbar-nav">
                    <li class="nav-item"><a href="index.html" class="nav-link text-white">Home</a></li>
                    <li class="nav-item"><a href="" class="nav-link text-white">Esplora</a></li>
                    <li class="nav-item"><a href="contatti.html" class="nav-link text-white">Contatti</a></li>
                    <li class="nav-item"><button class="btn btn-light text-purple rounded-pill">Iscriviti gratis</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="d-flex flex-column justify-content-center align-items text-center" id="head">
        <h1 class="text-primary">Scopri il Potere del Tempo Libero</h1>
        <div class="bg-light"></div>
        <p class="text-white">Esplora passioni e interessi che arricchiscono la tua vita. Ogni hobby è una nuova avventura.</p>
        <div class="text-center">
            <button class="btn btn-light rounded-pill w-25 ">Inizia l'Esplorazione</button>
        </div>
        
    </header>

    <div class="container">
        <h5 class="text-primary">Hobby più comuni</h5>
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card bg-dark text-white hoverlift overflow-hidden shadow rounded-4 border-3">
                    <img src="img/lettura.jpg" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Lettura</h5>
                        <button class="btn btn-warning" id="btnLettura">Scopri di più</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-dark text-white hoverlift overflow-hidden shadow rounded-4 border-3">
                    <img src="img/cucina.jpg" class="card-img-top ">
                    <div class="card-body">
                        <h5 class="card-title">Cucina</h5>
                        <button class="btn btn-warning" id="btnCucina">Scopri di più</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-dark text-white hoverlift overflow-hidden shadow rounded-4 border-3">
                    <img src="img/sport.avif" class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Sport</h5>
                        <button class="btn btn-warning" id="btnSport">Scopri di più</button>
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="container text-center p-5 rounded-4 m-2 border border-warning" id="sfondoParagrafo">
                    <h4 id="paragrafo">Clicca su una card per visualizzare la sua descrizione.</h4>
                </div>
            </div>

        </div>
    </div>


    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
