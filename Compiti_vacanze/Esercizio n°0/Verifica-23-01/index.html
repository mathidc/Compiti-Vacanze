<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="d-flex justify-content-between" id="header">
        <h1 class="fw-bold color-orange">Milano-Cortina 2026 🏂</h1>
        <p class="color-orange">Sei pronto per la sfida olimpica?</p>
        <button id="btnBiglietto">Prova a vincere un biglietto</button>
    </div>

    <div id="contMain">
        <div id="containerImg">
            <h3 class="color-orange">Sport Olimpici</h3>
            <div id="immagini">
                <img src="img/f1.jpg" class="foto">
                <img src="img/f2.jpg" class="foto">
                <img src="img/f3.jpg" class="foto">
                <img src="img/f4.jpg" class="foto">
                <img src="img/f5.jpg" class="foto">
                <img src="img/f6.jpg" class="foto">
            </div>
        </div>

        <div id="contenitoreVideo">
            <iframe src="img/videoHome.mp4" id="video" frameborder="0"></iframe>
        </div>
        <div id="contenitoreDomande" class="d-none">
            <h3 class="color-orange">Sfida Olimpica 2026</h3>
            
            <form>
                <p>1. Qual è il simbolo ufficiale delle Olimpiadi?</p>
                <label>
                <input type="radio" name="risposta" value="torcia">Torcia
                </label>
                <br>
                <label>
                <input type="radio" name="risposta" value="anelli">Cinque anelli Intrecciati
                </label>
                <br>
                <label>
                <input type="radio" name="risposta" value="bandiera">Una Bandiera
                </label>
            </form>
            <button id="verifica" onclick="verificaRisposta()">Verifica</button>
            <p id="paragrafo"></p>
        </div>
    </div>

    <div id="but">
        <h1 class="fw-bold text-white">-15</h1>
        <h6 class="text-white">giorni</h6>
    </div>

    <div id="footer">
        <iframe id="maps" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2796.7827933184447!2d9.189981876733708!3d45.46408487107423!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4786c6cd1e9d1d3f%3A0xc7d1c34a9ddb2d5a!2sMilano%2C%20Italia!5e0!3m2!1sit!2sit!4v1642680000000!5m2!1sit!2sit" frameborder="0"></iframe>
        <div class="linea"></div>
        <p class="text-white">© 2026 Olimpiadi Milano-Cortina. Tutti i diritti riservati.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
