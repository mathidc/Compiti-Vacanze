<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body >
    <h1 class="text-center text-primary fw-bold">Battaglia Navale</h1>

    <div class="container" class="bg-white">
        <div  class="row">
            <div id="grigliaGioco" class="col-9"></div>
            <div class="col-3">
                <div id="campoStatistiche" >
                    <h3>Statistiche</h3>
                    <div></div>
                    <p>Tempo:  <span id="tempoMin"></span>:<span id="tempoSec"></span></p>
                    <p>Tentativi: <span id="numTentativi">0</span></p>
                    <p>Navi Rimaste: <span class="text-danger" id="numColpi"></span></p>
                    
                </div>
                <button class="btn btn-primary" id="btnNuovaPartita">Nuova partita</button>
                <p id="paragrafo"></p>
                <p id="paragrafoTempo"></p>

                <button class="btn btn-warning" id="btnMostraNavi">Mostra posizione navi</button>
            </div>
            
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
