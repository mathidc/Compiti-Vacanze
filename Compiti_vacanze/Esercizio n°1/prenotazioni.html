<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a href="index.html" class="navbar-brand">Vivi Roma</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a href="index.html" class="nav-link active" >Home</a></li>
                        <li class="nav-item"><a href="luoghi.html" class="nav-link">Cosa vedere</a></li>
                        <li class="nav-item"><a href="itinerario.html" class="nav-link">Itinerario</a></li>
                        <li class="nav-item"><a href="prenotazioni.html" class="nav-link">Contantti</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <h1 class="text-center">Richiedi Informazioni</h1>
        <div class="mb-3">
            <label class="form-label">Nome e Cognome</label>
            <input type="text" class="form-control" placeholder="ES: Mario Rossi">
            <label class="form-label">Indirizzo email</label>
            <input type="email" class="form-control" placeholder="mario.rossi@email.com">
            <label class="form-label">Motivo di richiesta</label>
            <textarea class="form-control mb-2" rows="2" placeholder="Scrivi qui..."></textarea>
            <button class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#prenota">
                    Invia richiesta
            </button>
        </div>
    </main>

    <div class="modal fade" id="prenota">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Il pagamento è andato a buon fine</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p>La ringraziamo per essersi fidata di noi</p>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Chiudi</button>
                </div>

            </div>
        </div>
    </div>

    <footer>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <p class="text-center text-white" @copyright>2024 Guida turistica Roma - Progetto scolastico</p>
            </div>    
        </nav>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
